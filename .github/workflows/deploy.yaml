name: Deploy

# master -> gate -> image on GHCR -> manual approval -> 192.168.1.210 (2htswebserver).
on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Existing image digest to deploy (skips build, e.g. sha256:...). Leave empty to build HEAD.'
        required: false
        default: ''

# Never let two deploys touch the host at once, and never cancel one mid-flight.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  # Lowercase on purpose: registries reject uppercase paths, and github.repository
  # is HowTo-Software/howtoosoftware-panel-ptero.
  IMAGE: ghcr.io/howto-software/howtoosoftware-panel-ptero

jobs:
  checks:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.image_tag == '' }}
    uses: ./.github/workflows/checks.yaml

  build:
    name: Build and push
    needs: checks
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.image_tag == '' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.ref.outputs.image }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=short,prefix=sha-
            type=raw,value=master,enable={{is_default_branch}}

      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          # The panel host is x86_64; arm64 under QEMU costs minutes and ships nothing.
          platforms: linux/amd64
          build-args: |
            APP_VERSION=${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - id: ref
        name: Pin the deployable reference to a digest
        run: echo "image=${IMAGE}@${{ steps.push.outputs.digest }}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to 2htswebserver
    needs: build
    # `always()` so a workflow_dispatch that skipped build still runs.
    if: ${{ always() && !cancelled() && (needs.build.result == 'success' || inputs.image_tag != '') }}
    runs-on: [self-hosted, linux, X64, hts-panel]
    environment:
      name: production
      url: https://panel.howto.software
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: deploy
          sparse-checkout-cone-mode: false

      - name: Log in to GHCR
        run: echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin

      - name: Deploy
        env:
          PANEL_IMAGE: ${{ inputs.image_tag != '' && format('ghcr.io/howto-software/howtoosoftware-panel-ptero@{0}', inputs.image_tag) || needs.build.outputs.image }}
          GIT_SHA: ${{ github.sha }}
        run: |
          chmod +x deploy/deploy.sh
          deploy/deploy.sh "$PANEL_IMAGE"

      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io
